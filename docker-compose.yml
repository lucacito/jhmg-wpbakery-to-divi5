services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      - db
    ports:
      - "8020:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # Point the Pro licence client at a local licence server for e2e (host port 3100).
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WBDCP_API_BASE', 'http://host.docker.internal:3100' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - ./plugin/jhmg-converter-for-wpbakery-to-divi-5:/var/www/html/wp-content/plugins/jhmg-converter-for-wpbakery-to-divi-5:delegated
      - ./plugin/jhmg-converter-for-wpbakery-to-divi-pro:/var/www/html/wp-content/plugins/jhmg-converter-for-wpbakery-to-divi-pro:delegated
      - ./references/Divi.zip:/tmp/Divi.zip:ro
      - ./references/js_composer.9.0.1.zip:/tmp/js_composer.zip:ro
      # A real WPBakery add-on beside Divi, so the e2e suite can convert a theme
      # element this converter has no handler for while its own plugin renders
      # it — the static-copy path. Ronneby Core cannot play that part: it
      # switches itself off unless the DFD Ronneby theme is the active one
      # (docs/conversion-workflow.md). Optional — setup_wp.sh skips it when absent.
      - ./references/Ultimate_VC_Addons.zip:/tmp/ultimate-vc-addons.zip:ro
      - ./fixtures:/var/www/html/fixtures:ro
      # The committed theme exports, so the seed can import one through the
      # plugin's own WXR path. The directory name really does hold a space.
      - "./wpbakery templates:/var/www/html/wpbakery-templates:ro"
      - wp_uploads:/var/www/html/wp-content/uploads
    # Wrap the real entrypoint to fix directory ownership before Apache starts,
    # while still passing apache2-foreground so WordPress setup runs.
    entrypoint: >
      bash -c "
        mkdir -p /var/www/html/wp-content/uploads /var/www/html/wp-content/et-cache &&
        chown -R www-data:www-data /var/www/html/wp-content/uploads /var/www/html/wp-content/et-cache &&
        exec docker-entrypoint.sh apache2-foreground
      "

volumes:
  db_data:
  wp_uploads:
